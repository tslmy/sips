name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake lcov just
          version: 1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests and coverage via just
        run: just test

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/build/RelWithDebInfo/coverage.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
